name: CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4.2.2

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/deploy-api.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/workflows/ci.yml'

  api-ci:
    name: API checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Apply local D1 migrations
        run: npm run wrangler -- d1 migrations apply phonetiq-db --local
        working-directory: api

      - name: Verify migrated D1 schema
        run: |
          set -euo pipefail
          TABLES_OUTPUT="$(npm run wrangler -- d1 execute phonetiq-db --local --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('word_pairs','word_pair_dialect_metadata','user_progress') ORDER BY name;")"
          echo "$TABLES_OUTPUT"
          for table in word_pairs word_pair_dialect_metadata user_progress; do
            if ! printf '%s\n' "$TABLES_OUTPUT" | grep -q "$table"; then
              echo "Missing required table: $table"
              exit 1
            fi
          done

          COLUMNS_OUTPUT="$(npm run wrangler -- d1 execute phonetiq-db --local --command "PRAGMA table_info(user_progress);")"
          echo "$COLUMNS_OUTPUT"
          if ! printf '%s\n' "$COLUMNS_OUTPUT" | grep -q "target_dialect"; then
            echo "Missing required column: user_progress.target_dialect"
            exit 1
          fi
        working-directory: api

      - name: Typecheck
        run: npm run typecheck
        working-directory: api

      - name: Test
        run: npm test
        working-directory: api

  web-ci:
    name: Web checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: https://api.phonetiq.mihassan.com

      - name: Test
        run: npm test
        working-directory: web
