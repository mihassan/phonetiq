name: Deploy API Worker

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Typecheck
        run: npm run typecheck
        working-directory: api

      - name: Test
        run: npm test
        working-directory: api

      - name: Apply remote D1 migrations
        run: npm run wrangler -- d1 migrations apply phonetiq-db --remote
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify remote D1 schema
        run: |
          set -euo pipefail
          TABLES_OUTPUT="$(npm run wrangler -- d1 execute phonetiq-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('word_pairs','word_pair_dialect_metadata','user_progress') ORDER BY name;")"
          echo "$TABLES_OUTPUT"
          for table in word_pairs word_pair_dialect_metadata user_progress; do
            if ! printf '%s\n' "$TABLES_OUTPUT" | grep -q "$table"; then
              echo "Missing required remote table: $table"
              exit 1
            fi
          done

          COLUMNS_OUTPUT="$(npm run wrangler -- d1 execute phonetiq-db --remote --command "PRAGMA table_info(user_progress);")"
          echo "$COLUMNS_OUTPUT"
          if ! printf '%s\n' "$COLUMNS_OUTPUT" | grep -q "target_dialect"; then
            echo "Missing required remote column: user_progress.target_dialect"
            exit 1
          fi
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'api'
