name = "phonetiq-api"
main = "src/index.ts"
compatibility_date = "2025-04-18"
workers_dev = true

routes = [{ pattern = "api.phonetiq.mihassan.com", custom_domain = true }]

[ai]
binding = "AI"

[vars]
WEB_ORIGIN = "https://phonetiq.mihassan.com"
GOOGLE_CLIENT_ID = "660048861953-11hsthhhf00nprvtuov8sorqd1vbt4q8.apps.googleusercontent.com"
OAUTH_REDIRECT_URI = "https://api.phonetiq.mihassan.com/api/auth/callback"
CORS_ALLOWED_ORIGINS = "https://phonetiq.pages.dev"
RECOGNITION_FOUNDATION_V2 = "false"
EXPERIMENT_TWO_PASS = "false"

[[d1_databases]]
binding = "DB"
database_name = "phonetiq-db"
database_id = "0794f6e7-3390-44ef-88be-23e35bbc4c67"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "phonetiq-audio"

# Rate Limiting - Tier 1: Strict limit for expensive AI endpoint
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Rate Limiting - Tier 2: Standard limit for all API endpoints
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
